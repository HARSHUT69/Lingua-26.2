name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - mc: "26.2"
            api: "0.161.0+26.2"
          - mc: "26.3"
            api: "0.161.0+26.3"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.8.2
      - run: gradle build --stacktrace -Pminecraft_version=${{ matrix.mc }} -Pfabric_api_version=${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        with:
          name: lingua-jar-${{ matrix.mc }}
          path: build/libs/*[!s].jar
